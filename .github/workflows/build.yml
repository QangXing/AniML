name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'DESIGN.md'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: 构建并上传 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 构建 Debug APK
        run: flutter build apk --debug

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: animl-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error