name: highres_html_renderer
description: 把 HTML 高像素渲染的 App —— 用 Flutter 做毛玻璃白色简洁 UI，把 HTML 渲染区当作被手机摄像头拍摄的背景，可放大/缩小/旋转/平移，并支持高像素截图与 mp4 拍摄输出。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView：承载导入的 HTML 渲染区
  webview_flutter: ^4.7.0
  # 仅 Android 后台线程 fetch 图片等用到（可选用），这里用于保证 web 视图职责清晰
  webview_flutter_android: ^3.13.0
  webview_flutter_wkwebview: ^3.13.0

  # 相机视口矩阵运算
  vector_math: ^2.1.4

  # 选择并导入本地 HTML 文件
  file_picker: ^8.0.0

  # 获取应用文档目录，存放导入的 HTML 副本
  path_provider: ^2.1.0

  # 帧合成 mp4（拍摄）—— ffmpeg-kit 原构件已从 Maven Central 移除，改用维护中的 fork
  ffmpeg_kit_flutter_new: ^4.6.2

  # 主免责后续分享视频
  share_plus: ^9.0.0

  # 拍摄完成后把 mp4 自动保存到系统影片目录（MediaStore，Android 10+ 无需额外权限）
  gal: ^2.3.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.jpg